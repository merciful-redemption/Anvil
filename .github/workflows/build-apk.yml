name: Build Anvil Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Anvil Debug APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          if [ -f Anvil-v5.0-debug.apk ]; then
            echo "Using pre-compiled Anvil-v5.0-debug.apk from repository root"
            cp Anvil-v5.0-debug.apk app/build/outputs/apk/debug/app-debug.apk
          elif [ -f .build-outputs/app-debug.apk ]; then
            echo "Using pre-compiled AI Studio APK (.build-outputs/app-debug.apk)"
            cp .build-outputs/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
          else
            if [ -f debug.keystore.base64 ]; then
              base64 -di debug.keystore.base64 > debug.keystore
            elif [ ! -f debug.keystore ]; then
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --update || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "platforms;android-36" || true
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Anvil APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anvil-v5.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
